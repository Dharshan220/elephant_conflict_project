# Render Blueprint - https://render.com/docs/blueprint-spec
#
# How to deploy:
#   1. Push this repo to GitHub.
#   2. On render.com:  New +  >  Blueprint  >  connect this repo.
#   3. Render creates the API service, then the static UI service.
#   4. After the API deploys, copy its URL (e.g. https://tuskerguard-api.onrender.com)
#      and paste it into the UI service env vars (VITE_API_URL / VITE_WS_URL),
#      then trigger a re-deploy of the UI service.
#
# Notes:
#   - Free-tier services sleep after 15 min idle; the first request after sleep
#     can take ~1 minute to wake up.
#   - SQLite data lives on the service disk and resets on redeploy; the backend
#     re-seeds cameras, alerts and demo accounts automatically on startup.

services:
  # ------------------------------------------------------------------ backend
  - type: web
    name: tuskerguard-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    pythonVersion: 3.12.0
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      # Randomly generated once at first deploy - signs all JWTs.
      - key: TUSKER_JWT_SECRET
        generateValue: true
      # Leave unset for mock push mode. To enable real FCM push, set this to a
      # Firebase Admin service-account JSON (relative to backend/ or absolute).
      - key: TUSKER_FCM_CREDENTIALS
        value: ""
      # Optional: point at a Render PostgreSQL instance.
      # NOTE: the current code uses SQLite (database.py get_conn) - switching
      # to PostgreSQL requires code changes, it is NOT just an env var today.
      - key: TUSKER_DB_URL
        value: ""

  # ------------------------------------------------------------------ frontend
  - type: web
    name: tuskerguard-ui
    runtime: static
    region: singapore
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishPath: dist
    envVars:
      # SET THESE IN THE RENDER DASHBOARD (envVars for the ui service) -
      #   VITE_API_URL = https://<your-api-service>.onrender.com
      #   VITE_WS_URL  = wss://<your-api-service>.onrender.com
      # (sync: false = placeholder; you must fill the value manually)
      - key: VITE_API_URL
        sync: false
      - key: VITE_WS_URL
        sync: false
